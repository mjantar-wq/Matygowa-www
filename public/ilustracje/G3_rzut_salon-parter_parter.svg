<style>.bryla{fill:var(--color-atrament,#1c2321);stroke:var(--color-atrament,#1c2321);stroke-width:24;stroke-linejoin:miter}.pokoj{fill:var(--color-tlo,#f1f3f2)}.pokoj.skos{fill:var(--color-tlo-2,#e4e9e7)}.stopnie{stroke:var(--color-linia-mocna,#7f8b86);stroke-width:1.5;vector-effect:non-scaling-stroke}.bieg{fill:none;stroke:var(--color-atrament-2,#37413d);stroke-width:1.5;vector-effect:non-scaling-stroke}#strzalka path{fill:var(--color-atrament-2,#37413d)}.sauna-deski{stroke:var(--color-bursztyn,#c47a2a);stroke-width:1;opacity:.6;vector-effect:non-scaling-stroke}.nazwa{font:500 19px var(--font-ui,sans-serif);letter-spacing:.12em;text-transform:uppercase;fill:var(--color-atrament,#1c2321);paint-order:stroke;stroke:var(--color-tlo,#f1f3f2);stroke-width:8px;stroke-linejoin:round}.dopisek{font:500 18px var(--font-ui,sans-serif);letter-spacing:.06em;font-variant-numeric:tabular-nums;fill:var(--color-wyciszony,#56625e)}.pokoj-g:hover .pokoj,.pokoj-g:focus .pokoj{fill:var(--color-tlo-2,#e4e9e7)}</style>
