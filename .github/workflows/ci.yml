name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # sama dokumentacja nie zmienia wdrożonej wersji
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      import_content:
        description: 'Wgraj treści robocze i obrazy CGI z content/ do bazy na Cloudflare (nadpisuje te same wpisy w panelu)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  PAYLOAD_SECRET: ci-only-secret
  NODE_OPTIONS: --no-deprecation

jobs:
  check:
    name: Typy, lint, testy, budowanie
    # testy biegną na PR (na scaleniu z main) i przy ręcznym uruchomieniu; po scaleniu do main
    # ich nie powtarzamy, bo wdrożenie i tak buduje stronę; szkice PR czekają na gotowość
    if: github.event_name != 'push' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # PR zmieniający tylko docs/ albo pliki .md w katalogu głównym nie potrzebuje testów
      - name: Zakres zmian
        id: zakres
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if echo "$files" | grep -qvE '^docs/|^[^/]+\.md$'; then
            echo "kod=true" >> "$GITHUB_OUTPUT"
          else
            echo "kod=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Zmiany tylko w dokumentacji, pomijam testy i budowanie."
          fi
      - if: steps.zakres.outputs.kod != 'false'
        uses: actions/checkout@v5
      - if: steps.zakres.outputs.kod != 'false'
        uses: pnpm/action-setup@v4
      - if: steps.zakres.outputs.kod != 'false'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.zakres.outputs.kod != 'false'
        run: pnpm install --frozen-lockfile
      # pamięć podręczna kompilacji Next skraca budowanie przy kolejnych PR
      - if: steps.zakres.outputs.kod != 'false'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - if: steps.zakres.outputs.kod != 'false'
        run: pnpm typecheck
      - if: steps.zakres.outputs.kod != 'false'
        run: pnpm lint
      - if: steps.zakres.outputs.kod != 'false'
        run: pnpm test
      # lokalna kopia D1 (.wrangler) z migracjami i treściami roboczymi z content/
      - name: Baza testowa
        if: steps.zakres.outputs.kod != 'false'
        run: pnpm payload migrate && pnpm seed
      - if: steps.zakres.outputs.kod != 'false'
        run: pnpm build
      # Google Chrome jest już na obrazie ubuntu-latest, więc nie pobieramy Chromium Playwrighta
      - name: Testy przeglądarkowe (Playwright)
        if: steps.zakres.outputs.kod != 'false'
        env:
          PW_CHROMIUM_PATH: /usr/bin/google-chrome
        run: pnpm test:e2e
      - name: Paczka Workera (OpenNext) i jej rozmiar
        if: steps.zakres.outputs.kod != 'false'
        run: |
          pnpm build:worker
          pnpm exec wrangler deploy --dry-run --outdir dist | grep -E "Total Upload"

  deploy:
    name: Wdrożenie na matygowa.audiowizard.pl
    needs: check
    # przy pushu do main check jest pominięty, przy ręcznym uruchomieniu musi przejść
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Sprawdź sekrety Cloudflare
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Brak sekretów CLOUDFLARE_API_TOKEN lub CLOUDFLARE_ACCOUNT_ID, pomijam wdrożenie (docs/wdrozenie.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # szybka kontrola typów zamiast pełnych testów: łapie konflikt dwóch PR scalonych jeden po drugim
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm typecheck
      - name: Zasoby Cloudflare (R2) i sekret Payload
        if: steps.secrets.outputs.ready == 'true'
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          pnpm exec wrangler r2 bucket info matygowa-www-media --jurisdiction eu >/dev/null 2>&1 \
            || pnpm exec wrangler r2 bucket create matygowa-www-media --jurisdiction eu
          if [ -z "$PAYLOAD_SECRET" ]; then
            echo "::error::Brak sekretu PAYLOAD_SECRET w repozytorium (docs/wdrozenie.md)"; exit 1
          fi
      # migracje przed kodem; zmiany schematu muszą być zgodne wstecz z działającą wersją
      - name: Migracje bazy (D1)
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm deploy:database
      - name: Wdróż stronę
        if: steps.secrets.outputs.ready == 'true'
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          pnpm deploy:app
          echo "$PAYLOAD_SECRET" | pnpm exec wrangler secret put PAYLOAD_SECRET
      - name: Test dymny
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null https://matygowa.audiowizard.pl/ && curl -fsS -o /dev/null https://matygowa.audiowizard.pl/en; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::matygowa.audiowizard.pl nie odpowiada po wdrożeniu"
          exit 1

  import:
    name: Import treści do bazy na Cloudflare
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.import_content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PAYLOAD_REMOTE_BINDINGS: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm seed
