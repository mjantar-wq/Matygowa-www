<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 1080 800" role="img" aria-label="Rzut poglądowy domku, układ z salonem na piętrze: piętro">
<style>.bryla{fill:var(--color-atrament);stroke:var(--color-atrament);stroke-width:24;stroke-linejoin:miter}.pokoj{fill:var(--color-tlo)}.pokoj.skos{fill:var(--color-tlo-2)}.stopnie{stroke:var(--color-linia-mocna);stroke-width:1.5;vector-effect:non-scaling-stroke}.sauna-deski{stroke:var(--color-bursztyn);stroke-width:1;opacity:.6;vector-effect:non-scaling-stroke}.nazwa{font:500 19px var(--font-ui,sans-serif);letter-spacing:.12em;text-transform:uppercase;fill:var(--color-atrament);paint-order:stroke;stroke:var(--color-tlo);stroke-width:8px;stroke-linejoin:round}.dopisek{font:500 18px var(--font-ui,sans-serif);letter-spacing:.06em;font-variant-numeric:tabular-nums;fill:var(--color-wyciszony)}.pokoj-g:hover .pokoj,.pokoj-g:focus .pokoj{fill:var(--color-tlo-2)}</style>
<polygon class="bryla" points="128,0 872,0 872,716 128,716"/>
<g id="r-lazienka-prywatna" class="pokoj-g" data-nazwa="Łazienka">
<rect class="pokoj" x="132" y="4" width="137" height="319"/>
<text class="nazwa" x="201" y="158" text-anchor="middle">Łazienka</text>
<text class="dopisek" x="201" y="186" text-anchor="middle">prywatna</text>
</g>
<g id="r-sypialnia-4" class="pokoj-g" data-nazwa="Sypialnia">
<rect class="pokoj" x="278" y="4" width="294" height="319"/>
<text class="nazwa" x="426" y="158" text-anchor="middle">Sypialnia</text>
<text class="dopisek" x="426" y="186" text-anchor="middle">z łazienką</text>
</g>
<g id="r-hol" class="pokoj-g" data-nazwa="hol">
<rect class="pokoj" x="582" y="4" width="136" height="124"/>
</g>
<g id="r-wc" class="pokoj-g" data-nazwa="WC">
<rect class="pokoj" x="582" y="138" width="136" height="186"/>
<text class="nazwa" x="650" y="238" text-anchor="middle">WC</text>
</g>
<g id="r-schody" class="pokoj-g" data-nazwa="Schody">
<rect class="pokoj" x="726" y="4" width="141" height="319"/>
<line class="stopnie" x1="726" y1="34" x2="868" y2="34"/>
<line class="stopnie" x1="726" y1="62" x2="868" y2="62"/>
<line class="stopnie" x1="726" y1="92" x2="868" y2="92"/>
<line class="stopnie" x1="726" y1="120" x2="868" y2="120"/>
<line class="stopnie" x1="726" y1="150" x2="868" y2="150"/>
<line class="stopnie" x1="726" y1="178" x2="868" y2="178"/>
<line class="stopnie" x1="726" y1="208" x2="868" y2="208"/>
<line class="stopnie" x1="726" y1="236" x2="868" y2="236"/>
<line class="stopnie" x1="726" y1="266" x2="868" y2="266"/>
<line class="stopnie" x1="726" y1="294" x2="868" y2="294"/>
<text class="nazwa" x="797" y="172" text-anchor="middle">Schody</text>
</g>
<g id="r-salon" class="pokoj-g" data-nazwa="Salon z kuchnią">
<rect class="pokoj" x="132" y="332" width="735" height="379"/>
<text class="nazwa" x="500" y="516" text-anchor="middle">Salon z kuchnią</text>
<text class="dopisek" x="500" y="544" text-anchor="middle">i jadalnią</text>
</g>
</svg>